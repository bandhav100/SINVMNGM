apiVersion: v1
kind: Secret
metadata:
  name: sims-secrets
  namespace: smart-inventory
  labels:
    app.kubernetes.io/name: smart-inventory
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "REPLACE_WITH_SECURE_POSTGRES_PASSWORD"
  JWT_SECRET: "REPLACE_WITH_BASE64_ENCODED_256BIT_SECRET_FOR_JWT_PRODUCTION"
